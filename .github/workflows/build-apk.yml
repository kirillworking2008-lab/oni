name: Build ONI PLR Studio Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install web dependencies & run PLC engine unit tests
        run: |
          npm ci
          npm test

      - name: Build offline IDE bundle & signed Android APK
        run: |
          chmod +x scripts/build-apk.sh
          npm run build:apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ONI-PLR-Studio-Android-APK
          path: ONI-PLR-Studio-Android.apk
